template: monster
noun: monsters
dialog: statblock
tags: [Boss, Lair, Legendary, Spellcaster, Skith, Slime, Stone Lion, Swarm, Welterbeast]
auto_tags:
  - { tag: Legendary, field: legendary_actions }
  - { tag: Boss, field: charged_actions }
  - { tag: Spellcaster, field: actions, item: Spellcasting }
columns:
  - key: name
    label: Name
  - key: cr
    label: CR
    type: number
    format: cr
  - key: type
    label: Creature Type
    type: list
    plain: true
    order: creature_types
  - key: size
    label: Size
    type: list
    order: sizes
  - key: ac
    label: AC
    type: number
    in_table: false
  - key: hp
    label: HP
    type: number
    in_table: false
  - key: alignment
    label: Alignment
    in_table: false
  - key: settings
    label: Settings
    type: list
    blank_as: "Any"
    order: settings
