search_fields: [flavor, traits, actions, bonus_actions, reactions, charged_actions, legendary_actions, regional_effects]
template: monster
noun: monsters
dialog: statblock
tags: [universal, Boss, Lair, Legendary, Spellcaster, Skith, Slime, Stone Lion, Swarm, Telepathy, Welterbeast]
auto_tags:
  - { tag: Boss, field: charged_actions }
  - { tag: Lair, field: regional_effects }
  - { tag: Legendary, field: legendary_actions }
  - { tag: Spellcaster, field: actions, item: Spellcasting }
  - { tag: Swarm, field: swarm, equals: "true" }
  - { tag: Telepathy, field: languages, contains: telepathy }
  - { prefix: Immunity, field: immunities, values: [damage_types, conditions] }
  - { prefix: Resistance, field: resistances, values: [damage_types] }
  - { prefix: Vulnerability, field: vulnerabilities, values: [damage_types] }
  - { prefix: Special Sense, field: senses, values: [special_senses] }
  - { prefix: Special Speed, field: speed, values: [special_speeds] }
  - { copy: true, field: note_type } # Creature Sub-Type
columns:
  - key: name
    label: Name
  - key: cr
    label: CR
    type: number
    format: cr
    order: [None, "..."]
  - key: type
    label: Creature Type
    type: list
    plain: true
    order: creature_types
  - key: size
    label: Size
    type: list
    order: sizes
  - key: ac
    label: AC
    type: number
    in_table: false
  - key: hp
    label: HP
    type: number
    in_table: false
  - key: alignment
    label: Alignment
    in_table: false
  - key: settings
    label: Settings
    type: list
    blank_as: "Any"
    order: settings
