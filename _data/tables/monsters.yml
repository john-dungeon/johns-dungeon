template: monster
noun: monsters
dialog: statblock
default_sort: cr
tags: [Boss, Legendary, Spellcaster, Swarm]
auto_tags:
  - { tag: Legendary, field: legendary_actions }
columns:
  - key: name
    label: Name
  - key: cr
    label: CR
    type: number
    format: cr
  - key: type
    label: Creature Type
    type: list
    plain: true
    order: creature_types
  - key: size
    label: Size
    type: list
    order: sizes
  - key: ac
    label: AC
    type: number
    in_table: false
  - key: hp
    label: HP
    type: number
    in_table: false
  - key: alignment
    label: Alignment
    in_table: false
  - key: settings
    label: Settings
    type: list
    order: settings
