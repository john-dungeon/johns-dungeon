template: item
noun: items
tags: [Area, Armor Class Bonus, Attack Bonus, Charges, Condition, Consumable, Damage, Damage Bonus, Extra Damage, Forced Movement, Healing, Immunity, Magic Item, Resistance, Saving Throw, Spell]
marker:
  symbol: "✦"
  tag: Magic Item
  color_by: rarity
  label: Magic Item
columns:
  - key: name
    label: Name
  - key: type
    label: Type
    order: [Armor, Potion, Weapon, Wondrous Item]
  - key: rarity
    label: Rarity
    type: rank
    order: [None, Varies, Common, Uncommon, Rare, Very Rare, Legendary, Artifact]
  - key: cost
    label: Cost
    type: number
    format: money
    slider: { max: 300000, min_label: None, max_label: Priceless }
  - key: weight
    label: Weight
    type: number
    suffix: " lb."
    zero_label: Weightless
    order: [Weightless, "...", Varies]
    slider: { max: 500, min_label: Weightless, max_label: "500+" }
  - key: attunement
    label: Attunement
    type: rank
    blank_as: "n/a"
    order: ["n/a", "false", "true"]
    symbols:
      "n/a": "—"
      "false": "☐"
      "true": "☒"
    labels:
      "n/a": "N/A"
      "false": "None"
      "true": "Required"
