template: item
noun: items
tags: [Advantage, Area, Armor Class Bonus, Attack Bonus, Buff, Charges, Condition, Consumable, Cursed, Damage, Damage Bonus, Debuff, Disadvantage, Extra Damage, Forced Movement, Healing, Immunity, Light, Magic Item, Resistance, Revival, Saving Throw, Special Property, Spell]
marker:
  symbol: "✦"
  tag: Magic Item
  color_by: rarity
  label: Magic Item
columns:
  - key: name
    label: Name
  - key: type
    label: Type
    order: [Adventuring Gear, Armor, Potion, Weapon, Wondrous Item]
  - key: rarity
    label: Rarity
    type: rank
    blank_as: "n/a"
    order: ["n/a", Varies, Common, Uncommon, Rare, Very Rare, Legendary, Artifact]
  - key: cost
    label: Cost
    type: number
    format: money
    zero_label: None
    order: [None, "...", Varies, Priceless]
    slider: { max: 300000, min_label: None, max_label: Priceless }
  - key: weight
    label: Weight
    type: number
    format: weight
    zero_label: Weightless
    order: [Weightless, "...", Varies]
    slider: { max: 500, min_label: Weightless, max_label: "500+" }
  - key: attunement
    label: Attunement
    type: rank
    blank_as: "n/a"
    order: ["n/a", "false", "true"]
    symbols:
      "n/a": "—"
      "false": "☐"
      "true": "☒"
    labels:
      "n/a": "N/A"
      "false": "None"
      "true": "Required"
