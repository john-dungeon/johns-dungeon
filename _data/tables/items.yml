template: item
noun: items
tags: [universal, Bonus, Charge, Command Word, Consumable, Cover, Cursed, Magic Item, Mastery Property, Setting-Specific, Special Mastery Property, Special Property, Spell, Variant, Weapon Property]
auto_tags:
  - { tag: Setting-Specific, field: settings }
  - { tag: Variant, field: variant, equals: "true" }
markers:
  - symbol: "✦"
    tag: Magic Item
    color_by: rarity
    label: Magic Item
  - symbol: "☁"
    tag: Setting-Specific
    color_by: settings
    label: Settings
  - symbol: "⧨"
    tag: Variant
    label: Variant
columns:
  - key: name
    label: Name
  - key: category
    label: Category
    order: item_types
  - key: rarity
    label: Rarity
    type: rank
    blank_as: "n/a"
    order: rarities
    symbols: { "n/a": "—" }
    labels:
      "n/a": "N/A"
  - key: cost
    label: Cost
    type: number
    format: money
    unit: GP
    zero_label: None
    order: [None, "...", Varies, Priceless]
    slider: { max: 300000, min_label: None, max_label: Priceless }
  - key: weight
    label: Weight
    type: number
    format: weight
    unit: lb.
    zero_label: Weightless
    order: [Weightless, "...", Varies]
    slider: { max: 500, min_label: Weightless, max_label: "500+" }
  - key: attunement
    label: Attunement
    type: rank
    blank_as: "n/a"
    order: ["n/a", "false", "true"]
    symbols:
      "n/a": "—"
      "false": "☐"
      "true": "☒"
    labels:
      "n/a": "N/A"
      "false": "None"
      "true": "Required"
  - key: settings
    label: Settings
    type: list
    in_table: false
    order: settings
