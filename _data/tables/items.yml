template: item
noun: items
tags: [Area, Armor Class Bonus, Attack Bonus, Buff, Charge, Condition, Consumable, Cursed, Damage, Damage Bonus, Debuff, Extra Damage, Forced Movement, Healing, Immunity, Light, Magic Item, Resistance, Revival, Saving Throw, Setting-Specific, Special Mastery Property, Special Property, Speed Bonus, Spell]
auto_tags:
  - { tag: Setting-Specific, field: setting }
markers:
  - symbol: "✦"
    tag: Magic Item
    color_by: rarity
    label: Magic Item
  - symbol: "☗"
    tag: Setting-Specific
    color_by: setting
    label: Setting
columns:
  - key: name
    label: Name
  - key: type
    label: Type
    order: [Adventuring Gear, Armor, Mount, Potion, Ring, Rod, Scroll, Staff, Tool, Vehicle, Wand, Weapon, Wondrous Item]
  - key: rarity
    label: Rarity
    type: rank
    blank_as: "N/A"
    order: ["N/A", Varies, Common, Uncommon, Rare, Very Rare, Legendary, Artifact]
  - key: cost
    label: Cost
    type: number
    format: money
    zero_label: None
    order: [None, "...", Varies, Priceless]
    slider: { max: 300000, min_label: None, max_label: Priceless }
  - key: weight
    label: Weight
    type: number
    format: weight
    zero_label: Weightless
    order: [Weightless, "...", Varies]
    slider: { max: 500, min_label: Weightless, max_label: "500+" }
  - key: attunement
    label: Attunement
    type: rank
    blank_as: "n/a"
    order: ["n/a", "false", "true"]
    symbols:
      "n/a": "—"
      "false": "☐"
      "true": "☒"
    labels:
      "n/a": "N/A"
      "false": "None"
      "true": "Required"
  - key: setting
    label: Setting
    type: list
    in_table: false
    order: [Big Blue, City 13, Drachenfell, Erisia, Great Luminant, Hiraeth, Jingyu City, New Moon City, Solachia]
