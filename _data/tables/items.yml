template: item
noun: items
tags: [Ability Check, Area, Armor Class Bonus, Attack Bonus, Buff, Charge, Command Word, Condition, Consumable, Cursed, Damage, Damage Bonus, Damage Reduction, Debuff, Extra Damage, Forced Movement, Healing, Immunity, Light, Magic Item, Resistance, Revival, Saving Throw, Setting-Specific, Special Mastery Property, Special Property, Special Speed Bonus, Speed Bonus, Spell]
auto_tags:
  - { tag: Setting-Specific, field: setting }
markers:
  - symbol: "✦"
    tag: Magic Item
    color_by: rarity
    label: Magic Item
  - symbol: "☗"
    tag: Setting-Specific
    color_by: setting
    label: Setting
columns:
  - key: name
    label: Name
  - key: type
    label: Type
    order: [Adventuring Gear, Armor, Mount, Potion, Ring, Rod, Scroll, Staff, Tool, Vehicle, Wand, Weapon, Wondrous Item]
  - key: rarity
    label: Rarity
    type: rank
    blank_as: "N/A"
    order: ["N/A", Varies, Common, Uncommon, Rare, Very Rare, Legendary, Artifact]
  - key: cost
    label: Cost
    type: number
    format: money
    unit: GP
    zero_label: None
    order: [None, "...", Varies, Priceless]
    slider: { max: 300000, min_label: None, max_label: Priceless }
  - key: weight
    label: Weight
    type: number
    format: weight
    unit: lb.
    zero_label: Weightless
    order: [Weightless, "...", Varies]
    slider: { max: 500, min_label: Weightless, max_label: "500+" }
  - key: attunement
    label: Attunement
    type: rank
    blank_as: "n/a"
    order: ["n/a", "false", "true"]
    symbols:
      "n/a": "—"
      "false": "☐"
      "true": "☒"
    labels:
      "n/a": "N/A"
      "false": "None"
      "true": "Required"
  - key: setting
    label: Setting
    type: list
    in_table: false
    order: settings
