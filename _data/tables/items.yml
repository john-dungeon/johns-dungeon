template: item
noun: items
tags: [Consumable, Healing, Magic Item, Spell]
marker:
  symbol: "✦"
  tag: Magic Item
  color_by: rarity
  label: Magic Item
columns:
  - key: name
    label: Name
  - key: type
    label: Type
    options: [Potion, Weapon, Wondrous Item]
  - key: rarity
    label: Rarity
    type: rank
    order: [None, Varies, Common, Uncommon, Rare, Very Rare, Legendary, Artifact]
  - key: cost
    label: Cost
    type: number
    format: money
    suffix: " GP"
  - key: weight
    label: Weight
    type: number
    suffix: " lb."
  - key: attunement
    label: Attunement
    blank_as: "false"
    options: ["true", "false"]
    symbols:
      "true": "☒"
      "false": "☐"
    labels:
      "true": "Required"
      "false": "None"
