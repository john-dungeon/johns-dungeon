template: spell
noun: spells
tags: [Armor Class, Attack, Cleanse, Esoteric, Saving Throw]
columns:
  - key: name
    label: Name
  - key: level
    label: Level
    type: rank
    order: [Cantrip, 1, 2, 3, 4, 5, 6, 7, 8, 9]
  - key: school
    label: School
    order: [Abjuration, Conjuration, Divination, Enchantment, Evocation, Illusion, Necromancy, Transmutation]
  - key: casting_time
    label: Casting Time
    type: measure
    units: {second: 1, round: 6, minute: 60, hour: 3600, day: 86400}
    order: [Action, Bonus Action, Reaction]
  - key: range
    label: Range
    type: measure
    units: {foot: 1, feet: 1, mile: 5280}
    order: [Self, Touch, "...", Sight, Special, Unlimited]
    note:
      field: note_range
      format: " (%s)"
  - key: duration
    label: Duration
    type: measure
    units: {second: 1, round: 6, minute: 60, hour: 3600, day: 86400}
    order: [Instantaneous, "...", Concentration]
    note:
      field: concentration_max
      format: ", up to %s"
      sort: true
  - key: classes
    label: Classes
    type: list
    order: [Artificer, Bard, Cleric, Druid, Paladin, Ranger, Sorcerer, Warlock, Wizard]
