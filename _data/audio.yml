# Sound Settings
defaults: { effects: true, music: true }
volume: { effects: 0.5, music: 0.25 }

# Sound Effect Sets
# Events: open (pop-up), close (pop-up), enter (entrance screen), transition (page change)
sets:
  basic:
    open: assets/audio/click.ogg
    close: assets/audio/click.ogg
    transition: assets/audio/click.ogg
  dungeon:
    open: assets/audio/grind-in.ogg
    close: assets/audio/grind-out.ogg
    enter: assets/audio/entering.ogg
    transition: assets/audio/footsteps.ogg
  parchment:
    open: assets/audio/page.ogg
    close: assets/audio/page.ogg
    transition: assets/audio/page.ogg

# Music Playlists
playlists:
  basic:
    - assets/audio/music/Hia.ogg
  dungeon:
    - assets/audio/music/Anxiety.ogg
    - assets/audio/music/Silence.ogg
    - assets/audio/music/Tension.ogg
  parchment:
    - assets/audio/music/Morning.ogg
