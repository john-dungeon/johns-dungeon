# Sound Settings
defaults: { effects: true, music: true }
volume: { effects: 0.5, music: 0.25 }

# Sound Effect Sets
# Events: click, hover, open (pop-up), close (pop-up), enter (entrance screen)
sets:
  basic:
    click: assets/audio/basic/click.mp3
  dungeon:
    click: assets/audio/dungeon/click.mp3
    hover: assets/audio/dungeon/hover.mp3
    open: assets/audio/dungeon/open.mp3
    close: assets/audio/dungeon/close.mp3
    enter: assets/audio/entering.ogg
  parchment:
    click: assets/audio/parchment/click.mp3
    hover: assets/audio/parchment/hover.mp3
    open: assets/audio/parchment/open.mp3
    close: assets/audio/parchment/close.mp3

# Music Playlists
playlists:
  dungeon:
    - assets/audio/music/Anxiety.ogg
    - assets/audio/music/Silence.ogg
    - assets/audio/music/Tension.ogg
  parchment:
    - assets/audio/music/Morning.ogg
