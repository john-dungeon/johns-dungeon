# Settings
#  id: (Must match _sass/color_schemes/ID.scss and assets/css/just-the-docs-ID.scss)
#  label: (The name shown in the theme menu)
#  body_font / heading_font: (Google Font names; optional)
#  font_fallback: (Used if the font fails to load; optional; default "Georgia, serif")
#   fonts:
#    family: (Font name)
#    file: (File path)
#    weight: ("400" by default; use "200 900" for a variable font)
#    style: ("normal" by default; "italic")
#    preload: ("false" skips the early download)
#  background: (Image file for the page background; optional)
#  cursor: (Custom cursor; optional)
#   image: (PNG file, 32 x 32 px)
#   hotspot: ("x y" in image pixels: the exact point that does the clicking; "0 0" by default)
#   pointer: (Image shown over links and buttons; optional; defaults to the main image)
#  sounds: (Sound effect set from _data/audio.yml)
#  music: (Background music file; optional)
- id: dungeon
  label: "Dungeon 🔥"
  body_font: Crimson Pro
  heading_font: Cormorant SC
  background: assets/images/dungeon-bg.webp
  cursor: torch
  sounds: dungeon
  music: assets/audio/dungeon-theme.mp3
  fonts:
    - { family: Crimson Pro, file: assets/fonts/CrimsonPro-Regular.ttf }
    - { family: Crimson Pro, file: assets/fonts/CrimsonPro-Italic.ttf, style: italic }
    - { family: Crimson Pro, file: assets/fonts/CrimsonPro-SemiBold.ttf, weight: 600 }
    - { family: Cormorant SC, file: assets/fonts/CormorantSC-Medium.ttf, weight: 500 }
    - { family: Cormorant SC, file: assets/fonts/CormorantSC-Bold.ttf, weight: 700 }
- id: parchment
  label: "Parchment 📜"
  body_font: IM Fell English
  heading_font: IM Fell English SC
  background: assets/images/parchment-bg.webp
  sounds: parchment
  music: assets/audio/parchment-theme.mp3
  fonts:
    - { family: IM Fell English, file: assets/fonts/IMFellEnglish-Regular.ttf }
    - { family: IM Fell English, file: assets/fonts/IMFellEnglish-Italic.ttf, style: italic }
    - { family: IM Fell English SC, file: assets/fonts/IMFellEnglishSC-Regular.ttf }
- id: dark
  label: "Dark 🌑"
  sounds: basic
- id: light
  label: "Light ☀️"
  sounds: basic
