# Settings
#  id: (Must match _sass/color_schemes/ID.scss and assets/css/just-the-docs-ID.scss)
#  label: (The name shown in the theme menu)
#  body_font / heading_font: (Font family names from "fonts"; optional)
#  body_size / heading_size: (Text size in percent of normal; optional; defaults to 100)
#  heading_weight: (100 to 900, or "normal" or "bold"; optional; defaults to 400)
#  font_fallback: (Used if the font fails to load; optional; defaults to "Georgia, serif")
#  fonts:
#   family: (Font name)
#   file: (File path)
#   weight: ("400" by default; use "200 900" for a variable font)
#   style: ("normal" by default; "italic")
#   preload: (false skips the early download)
#  background: (WEBP file; 2560 × 1440 px; optional)
#  cursor: (Custom cursor; optional)
#   image: (Static: 32 × 32 px WEBP or PNG. Animated: WEBP, GIF, APNG, WEBM, or MP4)
#   animated: (true draws the cursor with a script so it can move; defaults to false)
#   size: (Animated only: displayed width in px; defaults to 32)
#   hotspot: ("x y" in displayed pixels; the exact point of clicking; defaults to "0 0")
#   pointer: (Image shown over links and buttons; optional; defaults to the main image)
#  sounds: (Sound effect set from _data/audio.yml; optional)
#  music: (Music playlist from _data/audio.yml; optional)
#  effects: (Ambient effects for this theme; optional)
#   id: (File name in assets/js/site/effects/, without .js)
#   any other keys: (Options handed to that effect)
- id: dungeon
  label: "Dungeon 🔥"
  body_font: Pixelify Sans
  heading_font: Jersey 10
  body_size: 100
  heading_size: 120
  heading_weight: normal
  fonts:
    - { family: Pixelify Sans, file: assets/fonts/PixelifySans-VariableFont_wght.ttf }
    - { family: Jersey 10, file: assets/fonts/Jersey10-Regular.ttf }
  background: assets/images/backgrounds/dungeon.webp
  cursor:
    image: assets/images/cursors/torch.webp
    animated: true
    size: 32
    hotspot: 16 16
  sounds: dungeon
  music: dungeon
  effects:
    - { id: torch-glow, x: 16, y: 16 }
    - { id: vignette }
- id: parchment
  label: "Parchment 📜"
  body_font: IM Fell English
  heading_font: IM Fell English SC
  body_size: 100
  heading_size: 100
  heading_weight: bold
  fonts:
    - { family: IM Fell English, file: assets/fonts/IMFellEnglish-Regular.ttf }
    - { family: IM Fell English, file: assets/fonts/IMFellEnglish-Italic.ttf, style: italic }
    - { family: IM Fell English SC, file: assets/fonts/IMFellEnglishSC-Regular.ttf }
  background: assets/images/parchment-bg.webp
  sounds: parchment
  music: parchment
- id: dark
  label: "Dark 🌑"
  sounds: basic
- id: light
  label: "Light ☀️"
  sounds: basic
