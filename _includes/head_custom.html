<!-- FAVICON -->
<link rel="icon" type="image/webp" href="{{ '/assets/favicon.webp' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/favicon.webp' | relative_url }}">

<!-- VISIT (must come first: it may reset what the theme and text size scripts read) -->
<script>window.SITE_SESSION = { timeout: {{ site.data.session.timeout | jsonify }}, reset: {{ site.data.session.reset | jsonify }}, gate: {{ site.data.gate.enabled | jsonify }} };</script>
<script src="{{ '/assets/js/session.js' | relative_url }}"></script>

<!-- THEME -->
<script>window.SITE_THEMES = {{ site.data.themes | jsonify }}; window.SITE_DEFAULT_THEME = {{ site.color_scheme | jsonify }}; window.SITE_ROOT = {{ '/' | relative_url | jsonify }};</script>
<script src="{{ '/assets/js/theme-switcher.js' | relative_url }}"></script>
{%- for theme in site.data.themes %}
<link rel="prefetch" href="{{ '/assets/css/just-the-docs-' | append: theme.id | append: '.css' | relative_url }}">
{%- endfor %}

<!-- EFFECTS SNAPSHOT -->
<script>window.SITE_BUILD = {{ site.time | date: "%s" | jsonify }};</script>
<script src="{{ '/assets/js/effects-snapshot.js' | relative_url }}"></script>

<!-- SITE DATA FOR SCRIPTS -->
<script>window.SITE_STRINGS = {{ site.data.strings | jsonify }}; window.SITE_LISTS = {{ site.data.lists | jsonify }}; window.SITE_AUDIO = {{ site.data.audio | jsonify }};</script>

<!-- SCRIPTS -->
<script src="{{ '/assets/js/navbar-toggle.js' | relative_url }}"></script>
<script src="{{ '/assets/js/text-size.js' | relative_url }}"></script>
<script src="{{ '/assets/js/tooltips.js' | relative_url }}" defer></script>
<script type="module" src="{{ '/assets/js/search-table/main.js' | relative_url }}"></script>
<script type="module" src="{{ '/assets/js/site/main.js' | relative_url }}"></script>

<!-- REDIRECT -->
{%- if page.redirect_url -%}
<meta http-equiv="refresh" content="0; url={{ page.redirect_url | relative_url }}">
{%- endif -%}
