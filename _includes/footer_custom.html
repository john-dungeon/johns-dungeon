<button id="theme-toggle" type="button" aria-label="Switch color scheme">Switch to Light ☀️</button>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('theme-toggle');
    var link = document.querySelector('link[rel="stylesheet"][href*="just-the-docs-"]');
    if (!btn || !link) return;

    var schemes = { dark: 'dark', light: 'light' };
    
    function current() {
      return /light\.css/.test(link.getAttribute('href')) ? 'light' : 'dark';
    }

    function apply(theme) {
      link.setAttribute(
        'href',
        link.getAttribute('href').replace(/just-the-docs-[a-z-]+\.css/, 'just-the-docs-' + schemes[theme] + '.css')
      );
      btn.textContent = theme === 'dark' ? 'Switch to Light ☀️' : 'Switch to Dark 🌙';
      try { localStorage.setItem('theme', theme); } catch (e) {}
    }

    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    if ((saved === 'light' || saved === 'dark') && saved !== current()) {
      apply(saved);
    } else {
      btn.textContent = current() === 'dark' ? 'Switch to Light ☀️' : 'Switch to Dark 🌙';
    }

    btn.addEventListener('click', function () {
      apply(current() === 'dark' ? 'light' : 'dark');
    });
  });
</script>
