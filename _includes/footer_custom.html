{%- assign fc_ui = site.data.strings -%}
{%- assign fc_size = site.data.text_size -%}
{%- if page.unfinished %}
{% include quote.html text=fc_ui.unfinished %}
{%- endif %}
{% include backlink.html %}
<div id="dock">
  <div class="dock-item">
    <div class="dock-menu" id="sound-menu" role="group" aria-label="{{ fc_ui.sound_button | escape }}" hidden>
      <label class="dock-row"><input type="checkbox" data-sound="effects"> {{ fc_ui.sound_effects }}</label>
      <label class="dock-row"><input type="checkbox" data-sound="music"> {{ fc_ui.sound_music }}</label>
    </div>
    <button type="button" class="dock-button" aria-haspopup="true" aria-expanded="false" aria-controls="sound-menu">{{ fc_ui.sound_button }}</button>
  </div>

  <div class="dock-item">
    <div class="dock-menu dock-menu--wide" id="size-menu" role="group" aria-label="{{ fc_ui.size_button | escape }}" data-min="{{ fc_size.min }}" data-max="{{ fc_size.max }}" data-step="{{ fc_size.step }}" hidden>
      <div class="dock-row dock-row--split">
        <button type="button" class="dock-option dock-step" id="size-down" aria-label="{{ fc_ui.size_smaller | escape }}">−</button>
        <output id="size-value" aria-live="polite"></output>
        <button type="button" class="dock-option dock-step" id="size-up" aria-label="{{ fc_ui.size_larger | escape }}">+</button>
      </div>
      <button type="button" class="dock-option" id="size-reset">{{ fc_ui.size_reset }}</button>
    </div>
    <button type="button" class="dock-button" aria-haspopup="true" aria-expanded="false" aria-controls="size-menu">{{ fc_ui.size_button }}</button>
  </div>

  <div class="dock-item">
    <div class="dock-menu" id="theme-menu" role="menu" hidden>
      {%- for theme in site.data.themes %}
      <button type="button" class="dock-option" role="menuitem" data-theme="{{ theme.id }}">{{ theme.label }}</button>
      {%- endfor %}
    </div>
    <button id="theme-toggle" type="button" class="dock-button" aria-haspopup="true" aria-expanded="false" aria-controls="theme-menu">{{ fc_ui.theme_button }}</button>
  </div>
</div>
{% include gate.html %}
