<button id="theme-toggle" type="button" aria-label="Switch color scheme">Switch to Light ☀️</button>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('theme-toggle');
    var link = document.querySelector('link[rel="stylesheet"][href*="just-the-docs-"]');
    if (!btn || !link) return;

    function current() {
      return /just-the-docs-parchment\.css/.test(link.getAttribute('href')) ? 'parchment' : 'dungeon';
    }

    function labelFor(theme) {
      return theme === 'dungeon' ? '📜 Parchment' : '🔥 Dungeon';
    }

    function apply(theme) {
      link.setAttribute(
        'href',
        link.getAttribute('href').replace(/just-the-docs-[a-z]+\.css/, 'just-the-docs-' + theme + '.css')
      );
      btn.textContent = labelFor(theme);
      try { localStorage.setItem('theme', theme); } catch (e) {}
    }

    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    if ((saved === 'parchment' || saved === 'dungeon') && saved !== current()) {
      apply(saved);
    } else {
      btn.textContent = labelFor(current());
    }

    btn.addEventListener('click', function () {
      apply(current() === 'dungeon' ? 'parchment' : 'dungeon');
    });
  });
</script>
