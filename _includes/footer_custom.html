<div id="theme-switcher">
  <div id="theme-menu" role="menu" hidden>
    {%- for theme in site.data.themes %}
    <button type="button" class="theme-option" role="menuitem" data-theme="{{ theme.id }}">{{ theme.label }}</button>
    {%- endfor %}
  </div>
  <button id="theme-toggle" type="button" aria-haspopup="true" aria-expanded="false">Theme</button>
</div>
