{%- assign gt_cfg = site.data.gate -%}
{%- if gt_cfg.enabled -%}
<dialog id="gate" data-focus="{{ gt_cfg.focus | escape }}" data-scale="{{ gt_cfg.scale }}" data-zoom="{{ gt_cfg.zoom }}" data-darken="{{ gt_cfg.darken }}" data-fade="{{ gt_cfg.fade }}" aria-label="{{ site.data.strings.gate_label | escape }}">
  {%- if gt_cfg.image %}
  <div class="gate-art" aria-hidden="true">
    <img class="gate-media" src="{{ gt_cfg.image | prepend: '/' | relative_url }}" alt="">
  </div>
  {%- endif %}
  <button type="button" id="gate-enter">{{ site.data.strings.gate_enter }}</button>
</dialog>
{%- endif -%}
