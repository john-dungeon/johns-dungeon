{%- assign gt_cfg = site.data.gate -%}
{%- if gt_cfg.enabled -%}
<dialog id="gate" data-delay="{{ gt_cfg.delay }}" data-fade="{{ gt_cfg.fade }}" aria-label="{{ site.data.strings.gate_label | escape }}">
  <div class="gate-art" aria-hidden="true"></div>
  <button type="button" id="gate-enter">{{ site.data.strings.gate_enter }}</button>
</dialog>
{%- endif -%}
